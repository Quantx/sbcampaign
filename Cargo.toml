[package]
name = "sbcampaign"
version = "0.1.0"
authors = ["QuantX"]
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
num_enum = "0.7.6"
sqlx = {version="0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"]}
systemd = {version="0.11.1", features = ["journal"]}
thiserror = "2.0.21"
tokio = {version="1.54.1", features = ["full"]}
tokio-stream = "0.1.19"
tokio-util = {version="0.7.20", features = ["codec", "rt"]}
toml = "1.2.1"
uuid = "1.29.0"
